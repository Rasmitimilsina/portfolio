<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Portfolio | Rasmi Timilsina - Single Page</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Manrope:wght@400;500;700;800&family=Cinzel:wght@600;700&display=swap" rel="stylesheet">

</head>
<style>
        :root {
            --bg-ink: #000000;
            --bg-panel: #eeeeee;
            --bg-panel-soft: #e8e8e8;
            --text-main: #111111;
            --text-muted: #474747;
            --line: rgba(119, 119, 119, 0.15);
            --accent: #000000;
            --accent-soft: #5e5e5e;
            --accent-alt: #3b3b3b;
            --shadow-lg: 0 20px 40px rgba(0, 0, 0, 0.04);
            --radius-lg: 24px;
            --radius-md: 16px;
            --space-1: 0.5rem;
            --space-2: 1rem;
            --space-3: 1.5rem;
            --space-4: 2rem;
            --space-5: 3rem;
            --font-heading: "Space Grotesk", sans-serif;
            --font-body: "Manrope", sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            scroll-behavior: smooth;
        }

        body {
            font-family: var(--font-body);
            line-height: 1.7;
            color: var(--text-main);
            min-height: 100vh;
            background:
                radial-gradient(circle at 10% -8%, rgba(255, 255, 255, 0.95), transparent 35%),
                radial-gradient(circle at 95% 6%, rgba(0, 0, 0, 0.04), transparent 32%),
                radial-gradient(circle at 58% 48%, rgba(59, 59, 59, 0.06), transparent 42%),
                linear-gradient(145deg, #f9f9f9 0%, #f3f3f3 46%, #eeeeee 100%);
        }

        a {
            color: inherit;
            text-decoration: none;
            transition: color 0.25s ease, transform 0.25s ease;
        }

        ul {
            list-style: none;
        }

        .container {
            width: min(1120px, 100% - 2.5rem);
            margin: 0 auto;
        }

        .card {
            background: linear-gradient(155deg, rgba(255, 255, 255, 0.95), rgba(243, 243, 243, 0.96));
            border: 1px solid var(--line);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg);
            backdrop-filter: blur(10px);
            padding: var(--space-4);
            margin-bottom: var(--space-4);
            transition: transform 0.35s ease, border-color 0.35s ease, box-shadow 0.35s ease, background-color 0.35s ease;
        }

        .card:hover {
            transform: translateY(-8px);
            border-color: rgba(119, 119, 119, 0.32);
            box-shadow: 0 26px 52px rgba(0, 0, 0, 0.08);
        }

        .sticky-header {
            position: sticky;
            top: 0;
            z-index: 1000;
            background: rgba(249, 249, 249, 0.9);
            border-bottom: 1px solid rgba(119, 119, 119, 0.25);
            backdrop-filter: blur(20px);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

   
           

        .navbar {
            min-height: 76px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: var(--space-2);
        }

        .logo {
            font-family: "Cinzel", serif;
            font-size: clamp(1.05rem, 1.9vw, 1.45rem);
            font-weight: 600;
            letter-spacing: 0.09em;
            text-transform: uppercase;
            color: #000000;
            text-shadow: none;
            position: relative;
            transition: transform 0.25s ease, text-shadow 0.25s ease;
        }

        .logo::after {
            content: "";
            position: absolute;
            left: 0;
            bottom: -6px;
            width: 100%;
            height: 2px;
            border-radius: 999px;
            background: linear-gradient(90deg, var(--accent), var(--accent-alt));
            transform: scaleX(0.82);
            opacity: 0.85;
            transition: transform 0.25s ease;
        }

        .logo:hover {
            transform: translateY(-1px);
            text-shadow: none;
        }

        .logo:hover::after {
            transform: scaleX(1);
        }

        .nav-links {
            display: flex;
            gap: var(--space-3);
            margin-left: auto;
            margin-right: var(--space-3);
        }

        .nav-links a {
            color: var(--text-muted);
            font-weight: 600;
            position: relative;
        }

        .nav-links a::after {
            content: "";
            position: absolute;
            left: 0;
            bottom: -6px;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, var(--accent), transparent 95%);
            transform: scaleX(0);
            transform-origin: left;
            transition: transform 0.25s ease;
        }

        .nav-links a:hover,
        .nav-links a.active {
            color: var(--text-main);
        }

        .nav-links a:hover::after,
        .nav-links a.active::after {
            transform: scaleX(1);
        }

        .nav-links a.is-current {
            color: var(--accent);
        }

        .nav-links a.is-current::after {
            transform: scaleX(1);
        }

        .consultant-btn,
        .cta-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.4rem;
            font-weight: 700;
            border-radius: 999px;
            border: 1px solid transparent;
            transition: transform 0.25s ease, box-shadow 0.25s ease, background-color 0.25s ease;
        }

        .consultant-btn {
            padding: 0.7rem 1.35rem;
            margin-left: 0.45rem;
            color: #ffffff;
            background: linear-gradient(135deg, var(--accent), var(--accent-alt));
            box-shadow: 0 12px 22px rgba(0, 0, 0, 0.14);
        }

        .consultant-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 16px 26px rgba(0, 0, 0, 0.18);
        }

        .menu-toggle {
            display: none;
            border: 1px solid var(--line);
            background: var(--bg-panel-soft);
            color: var(--text-main);
            font-size: 1.35rem;
            border-radius: 12px;
            cursor: pointer;
            line-height: 1;
            padding: 0.35rem 0.7rem;
        }

        .menu-toggle.is-active {
            background: var(--accent);
            color: #ffffff;
            border-color: rgba(0, 0, 0, 0.24);
        }

        #menu-checkbox {
            display: none;
        }

        section {
            padding: 5.8rem 0;
            scroll-margin-top: 90px;
        }

        section h2 {
            font-family: var(--font-heading);
            font-size: clamp(2rem, 4vw, 3rem);
            font-weight: 800;
            letter-spacing: -0.02em;
            margin-bottom: var(--space-4);
            text-align: center;
            color: var(--text-main);
            text-shadow: 0 1px 0 rgba(255, 255, 255, 0.65);
            transition: transform 0.25s ease, text-shadow 0.25s ease, letter-spacing 0.25s ease;
        }

        section h2:hover {
            letter-spacing: -0.01em;
            transform: translateY(-1px);
            text-shadow: 0 10px 24px rgba(0, 0, 0, 0.08);
        }

        section h2::after {
            content: "";
            display: block;
            width: 84px;
            height: 4px;
            margin: 0.8rem auto 0;
            border-radius: 999px;
            background: linear-gradient(90deg, var(--accent), var(--accent-alt));
        }

        .home-section {
            min-height: calc(100vh - 76px);
            display: flex;
            align-items: center;
            position: relative;
            overflow: hidden;
            isolation: isolate;
            background:
                linear-gradient(100deg, rgba(0, 0, 0, 0.02) 0%, rgba(255, 255, 255, 0.55) 50%, rgba(59, 59, 59, 0.05) 100%),
                radial-gradient(circle at 68% 56%, rgba(0, 0, 0, 0.05), transparent 42%);
        }

            .home-layout {
                width: 100%;
                display: grid;
                grid-template-columns: 1fr 0.9fr;
                gap: clamp(1rem, 2.2vw, 2rem);
                align-items: center;
            }

        .home-section::before,
        .home-section::after {
            content: "";
            position: absolute;
            width: 460px;
            height: 460px;
            border-radius: 50%;
            filter: blur(10px);
            z-index: 0;
            pointer-events: none;
        }

        .home-section::before {
            left: -110px;
            top: -60px;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.8), transparent 67%);
            animation: floatA 7.5s ease-in-out infinite;
        }

        .home-section::after {
            right: -110px;
            top: 28%;
            background: radial-gradient(circle, rgba(0, 0, 0, 0.08), transparent 68%);
            animation: floatB 9s ease-in-out infinite;
        }

        .hero-content {
            position: relative;
            z-index: 1;
            max-width: 760px;
            animation: revealUp 0.9s ease both;
        }

        .hero-kicker {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.38rem 0.85rem;
            border-radius: 999px;
            border: 1px solid rgba(119, 119, 119, 0.2);
            background: rgba(255, 255, 255, 0.86);
            color: var(--text-muted);
            font-size: 0.8rem;
            font-weight: 800;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            margin-bottom: 0.95rem;
        }

        .hero-kicker::before {
            content: "";
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #2f7a42;
            box-shadow: 0 0 0 6px rgba(47, 122, 66, 0.12);
        }

        .hero-visual {
            position: relative;
            z-index: 1;
            justify-self: end;
            width: min(430px, 100%);
            aspect-ratio: 1 / 1;
            display: grid;
            place-items: center;
        }

        .hero-visual::before,
        .hero-visual::after {
            content: "";
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
        }

        .hero-visual::before {
            inset: 9%;
            border: 1px dashed rgba(119, 119, 119, 0.28);
            box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.6);
            animation: spinSlow 18s linear infinite;
        }

        .hero-visual::after {
            width: 12px;
            height: 12px;
            top: 8%;
            left: 50%;
            transform: translateX(-50%);
            background: var(--accent-alt);
            box-shadow: 0 0 0 8px rgba(119, 119, 119, 0.1), 0 0 28px rgba(0, 0, 0, 0.14);
            animation: orbitDot 8s linear infinite;
            transform-origin: 0 152px;
        }

        .avatar-ring::before {
            content: "";
            position: absolute;
            inset: 8px;
            border-radius: 50%;
            background:
                radial-gradient(circle at center, transparent 58%, rgba(0, 0, 0, 0.16) 100%),
                linear-gradient(180deg, rgba(255, 255, 255, 0.18), transparent 30%, transparent 70%, rgba(0, 0, 0, 0.12));
            pointer-events: none;
            mix-blend-mode: normal;
            animation: vignetteBreath 8s ease-in-out infinite;
        }

        .avatar-ring {
            width: min(320px, 88%);
            aspect-ratio: 1 / 1;
            border-radius: 50%;
            padding: 9px;
            background: conic-gradient(from 120deg, var(--accent), var(--accent-alt), var(--bg-panel), var(--accent));
            box-shadow: 0 26px 60px rgba(0, 0, 0, 0.16), 0 0 0 14px rgba(255, 255, 255, 0.58), 0 0 54px rgba(0, 0, 0, 0.1);
            animation: floatAvatar 7.4s ease-in-out infinite;
            overflow: hidden;
            position: relative;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .avatar-ring:hover {
            transform: translateY(-3px) scale(1.01);
            box-shadow: 0 30px 66px rgba(0, 0, 0, 0.19), 0 0 0 14px rgba(255, 255, 255, 0.62), 0 0 64px rgba(0, 0, 0, 0.14);
        }

        .avatar-ring img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
            border: 2px solid rgba(119, 119, 119, 0.2);
            display: block;
            filter: contrast(1.08) brightness(1.04) saturate(1.12);
            animation: portraitDrift 12s ease-in-out infinite;
            transform-origin: center;
            transition: filter 0.35s ease, transform 0.35s ease;
        }

        .avatar-ring:hover img {
            filter: contrast(1.12) brightness(1.06) saturate(1.2);
            transform: scale(1.03);
        }

        .avatar-ring::after {
            content: "";
            position: absolute;
            inset: 8px;
            border-radius: 50%;
            background:
                linear-gradient(180deg, rgba(255, 255, 255, 0.18), transparent 22%, transparent 78%, rgba(0, 0, 0, 0.2)),
                repeating-linear-gradient(
                    180deg,
                    rgba(255, 255, 255, 0.05) 0,
                    rgba(255, 255, 255, 0.05) 1px,
                    transparent 1px,
                    transparent 4px
                );
            mix-blend-mode: normal;
            pointer-events: none;
            animation: filmPass 5.5s linear infinite;
        }

        .hero-content h1 {
            font-family: var(--font-heading);
            font-size: clamp(2.2rem, 5.4vw, 4.05rem);
            font-weight: 800;
            line-height: 1.07;
            letter-spacing: -0.02em;
            margin-bottom: 1rem;
            color: var(--text-main);
            text-wrap: balance;
            text-shadow: 0 1px 0 rgba(255, 255, 255, 0.72), 0 14px 34px rgba(0, 0, 0, 0.08);
            transition: transform 0.25s ease, text-shadow 0.25s ease;
        }

        .hero-content h1 span {
            color: var(--accent-alt);
            text-shadow: none;
            transition: color 0.22s ease, text-shadow 0.22s ease;
        }

        .hero-content:hover h1 {
            transform: translateY(-2px);
            text-shadow: 0 1px 0 rgba(255, 255, 255, 0.72), 0 20px 36px rgba(0, 0, 0, 0.12);
        }

        .hero-content:hover h1 span,
        .hero-content h1:hover span {
            color: #000000;
            text-shadow: none;
        }

        .hero-content p {
            font-size: clamp(1rem, 2vw, 1.24rem);
            color: var(--text-muted);
            max-width: 62ch;
            margin-bottom: 1rem;
            animation: revealUp 0.9s ease 0.15s both;
            text-wrap: pretty;
            line-height: 1.7;
            text-shadow: 0 1px 0 rgba(255, 255, 255, 0.45);
            position: relative;
            padding-bottom: 0.45rem;
        }

        .hero-content p::after {
            content: "";
            position: absolute;
            left: 0;
            bottom: 0;
            width: 0;
            height: 2px;
            background: linear-gradient(90deg, rgba(0, 0, 0, 0.65), rgba(94, 94, 94, 0.5));
            transition: width 0.28s ease;
        }

        .hero-content:hover p::after {
            width: min(260px, 80%);
        }

        .hero-role-line {
            margin-bottom: 1rem;
            font-weight: 700;
            color: var(--text-main);
            min-height: 1.8rem;
            display: flex;
            align-items: center;
            gap: 0.45rem;
        }

        .hero-role-label {
            color: var(--text-muted);
            font-weight: 700;
        }

        .hero-role-value {
            color: var(--accent);
            font-weight: 800;
            letter-spacing: 0.01em;
            animation: roleSwap 0.45s ease;
        }

        .hero-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 0.85rem;
            animation: revealUp 0.9s ease 0.3s both;
        }

        .home-quick-stats {
            margin-top: 1.15rem;
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 0.65rem;
            max-width: 540px;
        }

        .stat-pill {
            border-radius: 14px;
            border: 1px solid rgba(119, 119, 119, 0.16);
            background: rgba(255, 255, 255, 0.9);
            padding: 0.75rem 0.8rem;
            transition: transform 0.25s ease, box-shadow 0.25s ease;
        }

        .stat-pill:hover {
            transform: translateY(-3px);
            box-shadow: 0 14px 24px rgba(0, 0, 0, 0.08);
        }

        .stat-value {
            display: block;
            font-family: var(--font-heading);
            font-size: 1.05rem;
            font-weight: 800;
            color: var(--text-main);
            line-height: 1.15;
        }

        .stat-label {
            display: block;
            margin-top: 0.2rem;
            color: var(--text-muted);
            font-size: 0.8rem;
            font-weight: 700;
        }

        .home-scroll-cue {
            margin-top: 1rem;
            display: inline-flex;
            align-items: center;
            gap: 0.45rem;
            color: var(--text-muted);
            font-weight: 700;
            font-size: 0.92rem;
            transition: transform 0.25s ease, color 0.25s ease;
        }

        .home-scroll-cue:hover {
            color: var(--text-main);
            transform: translateX(3px);
        }

        .cta-button {
            padding: 0.82rem 1.45rem;
            border: 1px solid rgba(119, 119, 119, 0.15);
            color: var(--text-main);
            background: rgba(255, 255, 255, 0.92);
            position: relative;
            overflow: hidden;
        }

        .hero-actions .cta-button:nth-child(2) {
            border-color: rgba(119, 119, 119, 0.18);
            background: rgba(243, 243, 243, 0.95);
        }

        .cta-button::after {
            content: "";
            position: absolute;
            inset: -120% auto -120% -24%;
            width: 26%;
            transform: rotate(22deg);
            background: linear-gradient(180deg, transparent, rgba(255, 255, 255, 0.28), transparent);
            opacity: 0;
            transition: left 0.35s ease, opacity 0.35s ease;
        }

        .cta-button:first-child {
            border: none;
            color: #ffffff;
            background: linear-gradient(135deg, var(--accent), var(--accent-alt));
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.12);
        }

        .cta-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 22px rgba(0, 0, 0, 0.16);
        }

        .cta-button:hover::after {
            left: 108%;
            opacity: 1;
        }

        .about-content {
            display: flex;
            gap: var(--space-4);
            align-items: flex-start;
        }

        .profile-image {
            width: 260px;
            min-width: 260px;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            border-radius: var(--radius-md);
            border: 2px solid rgba(119, 119, 119, 0.18);
            box-shadow: 0 18px 35px rgba(0, 0, 0, 0.08);
            transition: transform 0.35s ease, border-color 0.35s ease, box-shadow 0.35s ease, filter 0.35s ease;
        }

        .profile-image:hover {
            transform: rotate(-1.8deg) scale(1.04);
            border-color: rgba(0, 0, 0, 0.5);
            box-shadow: 0 24px 44px rgba(0, 0, 0, 0.12);
            filter: contrast(1.08) saturate(1.05);
        }

        .bio-text h3 {
            font-family: var(--font-heading);
            font-size: 1.5rem;
            margin-bottom: 0.75rem;
            color: var(--accent-soft);
            letter-spacing: -0.02em;
            text-shadow: 0 1px 0 rgba(255, 255, 255, 0.5);
        }

        .bio-text p {
            color: var(--text-muted);
            margin-bottom: 0.9rem;
        }

        .about-metrics {
            margin-top: 0.6rem;
            margin-bottom: 1rem;
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 0.6rem;
        }

        .about-metric {
            border: 1px solid rgba(119, 119, 119, 0.15);
            background: rgba(255, 255, 255, 0.88);
            border-radius: 12px;
            padding: 0.62rem 0.7rem;
        }

        .about-metric-title {
            display: block;
            font-size: 0.86rem;
            font-weight: 800;
            color: var(--text-main);
            line-height: 1.3;
        }

        .about-metric-sub {
            display: block;
            margin-top: 0.2rem;
            font-size: 0.75rem;
            color: var(--text-muted);
            font-weight: 700;
        }

        .about-story-switcher {
            margin-top: 1rem;
            display: flex;
            flex-wrap: wrap;
            gap: 0.55rem;
        }

        .about-story-tab {
            border: 1px solid rgba(119, 119, 119, 0.17);
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.92);
            color: var(--text-muted);
            font: inherit;
            font-size: 0.82rem;
            font-weight: 800;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            padding: 0.48rem 0.8rem;
            cursor: pointer;
            transition: transform 0.25s ease, background-color 0.25s ease, color 0.25s ease;
        }

        .about-story-tab:hover,
        .about-story-tab.is-active {
            transform: translateY(-1px);
            background: var(--accent);
            color: #ffffff;
        }

        .about-focus-panel {
            margin-top: 0.85rem;
            border: 1px solid rgba(119, 119, 119, 0.15);
            border-radius: 14px;
            background: linear-gradient(160deg, rgba(255, 255, 255, 0.94), rgba(236, 236, 236, 0.95));
            padding: 0.9rem 1rem;
        }

        .about-focus-title {
            font-family: var(--font-heading);
            font-size: 1.03rem;
            color: var(--text-main);
            margin-bottom: 0.45rem;
            letter-spacing: -0.01em;
        }

        .about-focus-panel p {
            margin-bottom: 0.55rem;
        }

        .about-focus-list {
            margin: 0;
            padding-left: 1rem;
            color: var(--text-muted);
        }

        .about-focus-list li {
            margin-bottom: 0.3rem;
        }

        .skills-grid {
            margin-top: var(--space-3);
            display: grid;
            gap: 0.75rem;
            grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .skill-item {
            background: linear-gradient(145deg, rgba(255, 255, 255, 0.98), rgba(232, 232, 232, 0.98));
            border: 1px solid rgba(119, 119, 119, 0.15);
            border-radius: 12px;
            color: var(--text-main);
            text-align: center;
            padding: 0.8rem 0.9rem;
            font-weight: 700;
            transition: transform 0.25s ease, border-color 0.25s ease, background-color 0.25s ease, color 0.25s ease;
        }

        .skill-item:hover {
            transform: translateY(-4px) scale(1.02);
            border-color: rgba(0, 0, 0, 0.28);
            background: rgba(0, 0, 0, 0.92);
            color: #ffffff;
        }

        .project-content-flex {
            display: grid;
            grid-template-columns: 1.35fr 0.95fr;
            gap: var(--space-3);
            align-items: start;
        }

        .projects-intro {
            max-width: 760px;
            margin: 0 auto 1.5rem;
            color: var(--text-muted);
            text-align: center;
            font-size: 1.02rem;
        }

        .projects-page {
            position: relative;
            overflow: hidden;
        }

        .projects-page::before {
            content: "";
            position: absolute;
            inset: 2rem auto auto -8rem;
            width: 18rem;
            height: 18rem;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(0, 0, 0, 0.08), transparent 68%);
            pointer-events: none;
        }

        .projects-page::after {
